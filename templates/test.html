<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>test</title>

    <style>
        /* 
            * means everything
            removes default spaces
            box-sizing makes it easier to control the
            actual size of elements
        */
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /*
            controls entire webpage
            sets the default font, background color, text color, and line height
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #222;
            line-height: 1.6;
        }

        /* 
            Header 
            The dark section at top of page
        */
        header {
            background: #1f2937;
            color: white;
            padding: 25px 40px;
        }

        /*
            keeps content from becoming extremely wide on large screens
            auto center the content
        */
        .header-content {
            max-width: 1100px;
            margin: auto;
        }

        /*
            Control product name at top
        */
        .product-name {
            font-size: 2rem;
            font-weight: bold;
        }

        /*
            Control sentence under product name
        */
        .tagline {
            color: #d1d5db;
            margin-top: 5px;
        }

        /*
            Main content area
        */
        main {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 25px;
        }

        /*
            About page information
        */
        .about-card {
            background: white;
            border-radius: 12px;
            padding: 40px;

            /*
                will make the card have a shadow, making it look like it is floating above the page
            */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /*
            Control the main about reward heading
        */
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #1f2937;
        }

        /*
            Control the first paragraph describing the product
        */
        .description {
            font-size: 1.05rem;
            color: #4b5563;
            margin-bottom: 35px;
        }

        /*
            Information boxes showing:
            - Team name + number
            - Produt Version
            - Release Date
            - Product Name
        */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 4px solid #2563eb;
            padding: 20px;
            border-radius: 6px;
        }

        .info-label {
            font-size: 0.85rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.15rem;
            font-weight: bold;
            color: #111827;
        }

        /*
            Product description sections
        */
        .section {
            margin-top: 30px;
        }

        .section h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .section p {
            color: #4b5563;
        }

        /*
            Footer section
        */
        footer {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
            padding: 30px;
        }

        /*
            Responsive design for smaller screens
        */
        @media (max-width: 650px) {
            header {
                padding: 20px;
            }

            .product-name {
                font-size: 1.6rem;
            }

            main {
                margin: 30px auto;
                padding: 0 15px;
            }

            .about-card {
                padding: 25px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <a href="/">Back to Home</a>

    <footer>
        Good (Truck) Driver Incentive Program &mdash; Fall 2026
    </footer>

</body>
</html>
