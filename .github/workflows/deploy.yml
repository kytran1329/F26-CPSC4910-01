name: Deploy Website to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-26.04

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Navigating to project..."
            cd /home/ec2-user/F26-CPSC4910-01

            echo "Pulling latest changes..."
            git fetch
            git pull origin main

            echo "Stopping existing Gunicorn process..."

            if [ -f /home/ec2-user/gunicorn.pid ]; then
              PID=$(cat /home/ec2-user/gunicorn.pid)

              if kill -0 "$PID" 2>/dev/null; then
                kill -TERM "$PID"

                for i in $(seq 1 10); do
                  if ! kill -0 "$PID" 2>/dev/null; then
                    break
                  fi
                  sleep 1
                done
              fi

              rm -f /home/ec2-user/gunicorn.pid
            fi

            echo "Starting Gunicorn..."

            .venv/bin/gunicorn \
              --bind 127.0.0.1:8000 \
              --access-logfile /home/ec2-user/gunicorn-access.log \
              --error-logfile /home/ec2-user/gunicorn-error.log \
              --capture-output \
              --log-level debug \
              --pid /home/ec2-user/gunicorn.pid \
              --daemon \
              app:app

            echo "Deployment complete!"